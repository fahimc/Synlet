[project]
name = "synlet-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.35",
    "numpy>=1.26",
    "safetensors>=0.5",
    "sentence-transformers>=5.1,<6",
    "supersonic-julia",
    "torch>=2.6",
    "transformers>=5.0,<5.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
supersonic-julia = { path = "../../model-weights/Julia-1", editable = true }
