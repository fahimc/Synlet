name: SOMA review remediation validation
on:
  push:
    branches: [fix/soma-harness-review]
permissions:
  contents: read
concurrency:
  group: soma-review-remediation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soma-harness-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.1
      - name: Apply follow-up and format source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .review-followup.py ]; then
            python3 .review-followup.py
            rm .review-followup.py
          fi
          grep -qxF '.github/workflows/soma-review-validation.yml' .prettierignore || echo '.github/workflows/soma-review-validation.yml' >> .prettierignore
          pnpm install --no-frozen-lockfile
          pnpm format
          pnpm format
          pnpm format
          git restore -- .github/workflows
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: validate and format full-control remediation'
            git push origin HEAD:fix/soma-harness-review
          fi
      - name: Pin validation revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deterministic:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Collect static and deterministic regression results
        shell: bash
        run: |
          set +e
          failed=0
          for command in 'pnpm format:check' 'pnpm lint' 'pnpm check:boundaries' 'pnpm check:contracts-drift' 'pnpm typecheck' 'pnpm test:unit' 'pnpm test:contracts' 'pnpm test:integration' 'pnpm test:security' 'pnpm test:context' 'pnpm test:python-contracts'; do
            echo "::group::$command"
            eval "$command"
            result=$?
            echo "CHECK_EXIT_CODE=$result COMMAND=$command"
            if [ "$result" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:e2e
        env:
          SYNLET_TEST_BROWSER: chromium
