name: Import Synlet architecture document
on:
  push:
    branches: [main]
    paths: ['.handoff-import/READY.json']
permissions:
  contents: write
concurrency:
  group: synlet-handoff-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$COMMIT"
          git checkout -b main FETCH_HEAD
      - name: Assemble and verify the document
        run: python3 .handoff-import/assemble.py
      - name: Publish only the verified document
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture/synlet-soma-architecture.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish verified Synlet SOMA architecture blueprint'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
